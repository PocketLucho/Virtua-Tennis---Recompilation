# Builds the distributable packages (engine + builder, no game code) on every push to main.
# The packages are available as workflow artifacts; release.yml publishes them.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build zip
      - name: llvm-mingw
        run: |
          curl -sL -o lm.tar.xz https://github.com/mstorsjo/llvm-mingw/releases/download/20251104/llvm-mingw-20251104-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf lm.tar.xz -C $HOME
      - name: Build package
        run: LLVM_MINGW=$HOME/llvm-mingw-20251104-ucrt-ubuntu-22.04-x86_64 vt/tools/package_windows.sh $PWD/dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/VirtuaTennis-Recomp-win64.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libsdl2-dev libcurl4-openssl-dev \
            libudev-dev libpulse-dev libasound2-dev libgl-dev libzip-dev zlib1g-dev libao-dev
      - name: Build package
        run: vt/tools/package_linux.sh $PWD/dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/VirtuaTennis-Recomp-linux-x64.tar.gz

